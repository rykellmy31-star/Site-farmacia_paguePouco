name: Verificar autorizacao Cloudflare - leitura segura
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verificar-autorizacao-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar codigo homologado
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar Worker e bindings com token autorizado (GET somente)
        env:
          CLOUDFLARE_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/audit-cloudflare-readonly.mjs
