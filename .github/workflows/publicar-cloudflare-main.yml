name: Publicar Farmácia Pague Pouco na Cloudflare

# Somente alterações aprovadas e integradas à main podem publicar.
# Nenhum deploy a partir de PR, fork ou branch de desenvolvimento.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: producao-cloudflare-site-farmacia-paguepouco
  cancel-in-progress: false

jobs:
  publicar:
    if: github.repository == 'rykellmy31-star/Site-farmacia_paguePouco' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar versão aprovada
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar fluxos críticos da loja
        run: npm test

      - name: Verificar cupons de boas-vindas, consentimento e antifraude
        run: node --test tests/boas-vindas.test.js

      - name: Validar aprovacao e ativacao segura no cadastro antes da publicacao
        run: node --test tests/aprovacao-ativacao-primeiro-salvar.test.js
      - name: Validar parcelas sem juros em produto, checkout e sacola antes do deploy
        run: node --test tests/parcelamento-filtros-estoque.test.js tests/parcelamento-vitrine.test.js tests/parcelamento-cesta-dinamico.test.js

      - name: Validar notificacoes de venda paga no Windows
        run: node --test tests/avisos-vendas-desktop.test.js
      - name: Validar robo local e sincronizacao automatica antes do deploy
        run: node --test tests/inovafarma-robo-windows.test.js tests/inovafarma-robo-auto.test.js

      - name: Validar aviso de imagem ilustrativa em todas as fotos dos produtos
        run: node --test tests/aviso-imagens-ilustrativas.test.js
      - name: Validar upload e exibição de imagens AVIF em produtos
        run: node --test tests/imagens-avif-produtos.test.js
      - name: Validar preenchimento automático de dados da empresa nas páginas
        run: node --test tests/dados-institucionais-dinamicos.test.js
      - name: Validar importação segura de preços internos do InovaFarma
        run: node --test tests/inova-precos-internos-xlsx.test.js
      - name: Validar olhinho para mostrar e ocultar senha
        run: node --test tests/password-toggle.test.js
      - name: Validar exclusão segura de contas administrativas inativas
        run: node --test tests/excluir-usuarios-inativos.test.js
      - name: Validar botão compacto do WhatsApp no rodapé
        run: node --test tests/whatsapp-rodape-compacto.test.js
      - name: Testar cartão de crédito Mercado Pago Checkout Pro e conciliação segura
        run: node --test tests/mercadopago-checkout-pro-cartao.test.js
      - name: Validar recomendações na gaveta e antes do pagamento
        run: node --test tests/recomendacoes-gaveta-entrega.test.js
      - name: Validar inteligência de vendas e recomendações complementares
        run: node --test tests/inteligencia-vendas-recomendacoes.test.js
      - name: Validar recuperação inteligente de carrinhos com cupons e Evolution
        run: node --test tests/recuperacao-vendas.test.js tests/recuperacao-teste-whatsapp.test.js
      - name: Validar pulsação dos selos de desconto
        run: node --test tests/descontos-pulsantes.test.js tests/selo-desconto-controle-admin.test.js tests/visitas-site-analytics.test.js
      - name: Validar barra superior pulsante, cores e segurança
        run: node --test tests/barra-topo-pulsante.test.js
      - name: Validar fundo personalizável da página inicial
        run: node --test tests/fundo-home-personalizavel.test.js
      - name: Validar ritmo de 6 segundos e pausa manual de 10 segundos no carrossel
        run: node --test tests/carrossel-tempo-interacao.test.js
      - name: Verificar imagem correta dos banners no celular
        run: node --test tests/banner-mobile-imagem-principal.test.js
      - name: Validar agendamento semanal de banners e ordenação manual
        run: node --test tests/banners-agendamento-ordem.test.js
      - name: Validar ranking real de vendas e novidades exclusivas na home
        run: node --test tests/home-vitrines-sem-repeticao.test.js
      - name: Validar ofertas vigentes, vitrine completa e destaques sem repetição
        run: node --test tests/home-promocoes-vigentes.test.js
      - name: Testar bloqueio de controlados antes de publicar
        run: node --test tests/triagem-controlados.test.js tests/bloqueio-controlados-inova.test.js
      - name: Validar estoque positivo e exclusao de antimicrobianos da Visão Geral
        run: node --test tests/visao-geral-antimicrobianos-estoque.test.js
      - name: Testar painel de entregador, rotas locais e WhatsApp
        run: node --test tests/painel-entregador-rotas.test.js
      - name: Testar Evolution API - notificacoes transacionais seguras
        run: node --test tests/evolution-whatsapp.test.js
      - name: Validar descricao automatica por EAN Cosmos e Open Facts
        run: node --test tests/busca-descricao-ean.test.js
      - name: Validar fallback das origens de imagem por EAN
        run: node --test tests/fallback-origem-ean.test.js
      - name: Conferir imagens PNG de qualidade e ferramentas EAN separadas
        run: node --test tests/duas-ferramentas-ean-png.test.js
      - name: Validar foto automatica por EAN e checkout sem vendedor
        run: node --test tests/enriquecimento-automatico-ean.test.js
      - name: Validar busca por nome e gravação segura de dimensões em lote
        run: node --test tests/busca-medidas-nome-lote.test.js
      - name: Verificar busca automatica de peso e dimensoes via EAN
        run: node --test tests/busca-medidas-ean.test.js
      - name: Validar vendas presenciais, relatorio Inova e WhatsApp
        run: node --test tests/relatorio-vendas-presencial.test.js
      - name: Conferir pagamento presencial por CEP com dinheiro e troco
        run: node --test tests/pagamento-presencial-local.test.js
      - name: Validar OAuth Melhor Envio e tokens cifrados
        run: node --test tests/melhor-envio-oauth.test.js
      - name: Conferir cotação Melhor Envio sem compras nem etiquetas
        run: node --test tests/melhor-envio.test.js
      - name: Conferir correção segura de receita automática Inova
        run: node --test tests/inovafarma-receita-automatica.test.js tests/inovafarma-catalog-import.test.js tests/inovafarma-catalogo-substituicao.test.js tests/aprovacao-ativacao-primeiro-salvar.test.js

      - name: Proteger limpeza do catálogo, descontos e importações
        run: |
          node --test tests/inovafarma-limpeza-previa.test.js tests/inovafarma-limpeza-segura.test.js
          node --test tests/inovafarma-promocoes-csv.test.js tests/inovafarma-promocoes-layout-real.test.js tests/inovafarma-promocoes-admin.test.js
          node --test tests/inovafarma-csv-import.test.js

      - name: Impedir publicação de reset sem testes de histórico e segurança
        run: node --test tests/inovafarma-catalogo-substituicao.test.js tests/inovafarma-quarentena-conciliacao.test.js

      - name: Homologar componentes Cloudflare em armazenamento local isolado
        run: npm run test:cloudflare

      - name: Preparar arquivos de publicação
        run: npm run build

      - name: Compilar Worker sem implantar
        run: npm run check:cloudflare

      - name: Verificar credenciais de publicação (sem exibir valores)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN com permissão Workers Scripts Edit no GitHub Actions."
            exit 1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID em GitHub Actions Variables."
            exit 1
          fi
          echo "Variáveis presentes; os valores não serão exibidos."

      # wrangler.jsonc contém nome e binding existentes do Worker.
      # keep_vars=true preserva variáveis e segredos da produção; o banco
      # Durable Object é persistente e nunca é recriado por este workflow.
      - name: Publicar Worker existente na Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Testar site publicado (somente leitura, sem pedidos ou pagamentos)
        run: node scripts/smoke-cloudflare-readonly.mjs

      - name: Confirmar SHA publicado no GitHub Actions
        run: echo "PUBLICACAO_GITHUB_SHA=${{ github.sha }}"
