name: CI - revisao sem deploy
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Payment and Pix safety regressions (offline, mocked provider)
        run: node --test tests/payment-safety.test.js tests/pix-reconciliation.test.js tests/report-permissions.test.js tests/checkout-recovery.test.js tests/cart-integrity.test.js tests/admin-reconciliation-queue.test.js tests/order-notifications.test.js tests/customer-addresses.test.js tests/coupon-policy.test.js tests/session-security.test.js tests/cep-freight.test.js tests/developer-credit.test.js tests/branding-favicon.test.js tests/mercadopago-credentials.test.js tests/mercadopago-pix-diagnostics.test.js tests/compact-purchase-ui.test.js tests/cloudflare-production-config.test.js tests/paid-pix-status.test.js tests/order-history-privacy.test.js tests/sellers.test.js tests/inovafarma-panel.test.js tests/inovafarma-automation.test.js tests/inovafarma-catalog-import.test.js tests/order-status-banner-background.test.js tests/financial-ops-health.test.js tests/cloudflare-real-backup-cli.test.js tests/order-visibility.test.js
      - name: Desktop sale alerts - authorization and paid events
        run: node --test tests/avisos-vendas-desktop.test.js
      - name: Nested category navigation regression
        run: node --test tests/categorias-aninhadas.test.js
      - name: Verify PITR recovery readiness is read only and admin restricted
        run: node --test tests/pitr-readiness.test.js
      - name: Verify isolated backup restore and recurring Cloudflare alarms
        run: node --test tests/restore-rehearsal.test.js tests/financial-alarm.test.js
      - name: Robo Windows (CSV local e sincronizacao automatica segura)
        run: node --test tests/inovafarma-robo-windows.test.js tests/inovafarma-robo-auto.test.js
      - name: Triagem conservadora de possíveis controlados no CSV InovaFarma
        run: node --test tests/triagem-controlados.test.js
      - name: Bloqueio automático de controlados no robô e catálogo
        run: node --test tests/bloqueio-controlados-inova.test.js
      - name: Validar estoque positivo e exclusao de antimicrobianos da Visão Geral
        run: node --test tests/visao-geral-antimicrobianos-estoque.test.js
      - name: Testar Evolution API - notificacoes transacionais seguras
        run: node --test tests/evolution-whatsapp.test.js tests/evolution-connection.test.js
      - name: Validar descricao automatica por EAN Cosmos e Open Facts
        run: node --test tests/busca-descricao-ean.test.js
      - name: Validar Google Imagens via Bright Data sem chamadas pagas
        run: node --test tests/brightdata-google-imagens.test.js
      - name: Validar foto escolhida PNG e proteção do proxy Google
        run: node --test tests/salvar-google-imagem-png.test.js
      - name: Validar categorias existentes e classificação com confirmação
        run: node --test tests/categorizar-produtos-sem-categoria.test.js
      - name: Validar fundo personalizável da página inicial
        run: node --test tests/fundo-home-personalizavel.test.js
      - name: Validar ritmo de 6 segundos e pausa manual de 10 segundos no carrossel
        run: node --test tests/carrossel-tempo-interacao.test.js
      - name: Verificar imagem correta dos banners no celular
        run: node --test tests/banner-mobile-imagem-principal.test.js
      - name: Validar agendamento semanal de banners e ordenação manual
        run: node --test tests/banners-agendamento-ordem.test.js
      - name: Validar ofertas vigentes, vitrine completa e destaques sem repetição
        run: node --test tests/home-promocoes-vigentes.test.js
      - name: Validar rótulos semanais e datas das promoções InovaFarma
        run: node --test tests/vigencia-promocoes-categorias-listagem.test.js
      - name: Validar filtro de promoções por dia e seleção segura de produtos
        run: node --test tests/promocoes-semanais-selecao.test.js
      - name: Validar selecao Google na galeria antes de Salvar alteracoes
        run: node --test tests/google-imagens-galeria-antes-salvar.test.js
      - name: Validar fallback das origens de imagem por EAN
        run: node --test tests/fallback-origem-ean.test.js
      - name: Validar pesquisa de fotos por fabricante em catálogos abertos
        run: node --test tests/fotos-fabricantes-openfacts.test.js
      - name: Conferir imagens PNG de qualidade e ferramentas EAN separadas
        run: node --test tests/duas-ferramentas-ean-png.test.js
      - name: Validar câmera EAN no painel e leitura móvel sem CDN externa
        run: node --test tests/scanner-camera-ean-admin.test.js
      - name: Validar foto automatica por EAN e checkout sem vendedor
        run: node --test tests/enriquecimento-automatico-ean.test.js
      - name: Comprovar busca REAL de esmalte Dailus por EAN e download da foto
        run: node scripts/test-ean-dailus-live.mjs
      - name: Validar correspondência GTIN14 e GTIN13 de fraldas Personal
        run: node --test tests/personal-gtin14-ean.test.js
      - name: Comprovar mídia REAL das fraldas Personal em alta resolução
        run: node scripts/test-personal-imagem-live.mjs
      - name: Verificar busca automatica de peso e dimensoes via EAN
        run: node --test tests/busca-medidas-ean.test.js
      - name: Validar vendas presenciais, relatorio Inova e WhatsApp
        run: node --test tests/relatorio-vendas-presencial.test.js
      - name: Conferir pagamento presencial por CEP com dinheiro e troco
        run: node --test tests/pagamento-presencial-local.test.js
      - name: Conferir cotação Melhor Envio sem compras nem etiquetas
        run: node --test tests/melhor-envio.test.js
      - name: Conferir correção segura de receita automática Inova
        run: node --test tests/inovafarma-receita-automatica.test.js tests/inovafarma-catalog-import.test.js tests/inovafarma-catalogo-substituicao.test.js tests/aprovacao-ativacao-primeiro-salvar.test.js
      - name: Menu e pagina dedicada de importacao de estoque
        run: node --test tests/importacao-estoque-menu.test.js
      - name: InovaFarma legacy catalog reconciliation is read only and preserves orders
        run: node --test tests/inovafarma-limpeza-previa.test.js
      - name: InovaFarma raw stock CSV full reconciliation diagnostics
        run: node --test tests/inovafarma-limpeza-formatos-reais.test.js
      - name: Aprovação do cadastro e ativação no primeiro salvamento com barreiras sanitárias
        run: node --test tests/aprovacao-ativacao-primeiro-salvar.test.js
      - name: Parcelamento na vitrine, checkout e sacola dinâmica por total líquido
        run: node --test tests/parcelamento-filtros-estoque.test.js tests/parcelamento-vitrine.test.js tests/parcelamento-cesta-dinamico.test.js
      - name: InovaFarma full catalog replacement (fresh products, history and order protections)
        run: node --test tests/inovafarma-catalogo-substituicao.test.js tests/inovafarma-quarentena-conciliacao.test.js
      - name: InovaFarma archive confirmation, reversibility and protected catalog tests
        run: node --test tests/inovafarma-limpeza-segura.test.js
      - name: CSV initial stock import safety and zero inventory
        run: node --test tests/inovafarma-csv-import.test.js
      - name: InovaFarma promotional CSV parse, preview and safety (no database writes)
        run: node --test tests/inovafarma-promocoes-csv.test.js tests/inovafarma-promocoes-layout-real.test.js tests/inovafarma-promocoes-admin.test.js
      - name: InovaFarma promotional discounts application and checkout validity
        run: node --test tests/inovafarma-promocoes-aplicacao.test.js
      - name: INOVAFARMA stock connector safety tests
        run: node --test tests/inovafarma-stock.test.js
      - name: Existing integration tests (simulated payments only)
        run: npm test
      - name: Real browser responsive checks (320px to 1440px)
        run: node scripts/test-responsive.js
      - name: Cloudflare component tests
        run: npm run test:cloudflare
      - name: Build Cloudflare assets
        run: npm run build
      - name: Verify Worker compilation without publishing
        run: npm run check:cloudflare
      # Ensaio somente leitura, não dá deploy nem acessa credenciais do painel.
      # Nunca executar com secrets em pull requests externos (forks).
      - name: Cloudflare public smoke policy (offline, mocked GET only)
        run: node --test tests/cloudflare-public-smoke.test.js tests/cloudflare-build-diagnostics.test.js
      - name: Cloudflare production smoke GET only (no clients or payments)
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: node scripts/smoke-cloudflare-readonly.mjs
      - name: Audit Cloudflare read-only API access without exposing secrets
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          CLOUDFLARE_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/audit-cloudflare-readonly.mjs
