name: CI - revisao sem deploy
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Payment and Pix safety regressions (offline, mocked provider)
        run: node --test tests/payment-safety.test.js tests/pix-reconciliation.test.js tests/report-permissions.test.js tests/checkout-recovery.test.js tests/cart-integrity.test.js tests/admin-reconciliation-queue.test.js tests/order-notifications.test.js tests/customer-addresses.test.js tests/coupon-policy.test.js tests/session-security.test.js tests/cep-freight.test.js tests/developer-credit.test.js tests/branding-favicon.test.js tests/mercadopago-credentials.test.js tests/mercadopago-pix-diagnostics.test.js tests/compact-purchase-ui.test.js tests/cloudflare-production-config.test.js tests/paid-pix-status.test.js
      - name: Verify isolated backup restore and recurring Cloudflare alarms
        run: node --test tests/restore-rehearsal.test.js tests/financial-alarm.test.js
      - name: INOVAFARMA stock connector safety tests
        run: node --test tests/inovafarma-stock.test.js
      - name: Existing integration tests (simulated payments only)
        run: npm test
      - name: Real browser responsive checks (320px to 1440px)
        run: node scripts/test-responsive.js
      - name: Cloudflare component tests
        run: npm run test:cloudflare
      - name: Build Cloudflare assets
        run: npm run build
      - name: Verify Worker compilation without publishing
        run: npm run check:cloudflare
      # Ensaio somente leitura, não dá deploy nem acessa credenciais do painel.
      # Nunca executar com secrets em pull requests externos (forks).
      - name: Audit Cloudflare read-only API access without exposing secrets
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          CLOUDFLARE_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/audit-cloudflare-readonly.mjs
