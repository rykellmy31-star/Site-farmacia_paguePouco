name: Homologacao Cloudflare - somente leitura
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homologacao-cloudflare-readonly
  cancel-in-progress: false

jobs:
  auditoria:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download read-only source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only checks offline
        run: node --test tests/cloudflare-public-smoke.test.js
      - name: Test public production pages and private-route blocking (GET only)
        run: node scripts/smoke-cloudflare-readonly.mjs
      - name: Read only Worker bindings and deployment metadata
        env:
          CLOUDFLARE_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/audit-cloudflare-readonly.mjs
